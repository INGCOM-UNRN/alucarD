[pytest]
# Configuración de pytest para alucarD

# Directorio de tests
testpaths = tests

# Opciones por defecto
addopts = 
    -v
    --strict-markers
    --cov=generador_examenes
    --cov-report=term-missing
    --cov-report=html
    --cov-report=xml

# Marcadores personalizados
markers =
    slow: marca tests que son lentos
    integration: tests de integración
    unit: tests unitarios
    requires_weasyprint: requiere WeasyPrint instalado

# Patterns de archivos de test
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Ignorar warnings específicos
filterwarnings =
    ignore::DeprecationWarning
    ignore::PendingDeprecationWarning

# Cobertura mínima requerida
[coverage:run]
source = generador_examenes
omit = 
    */tests/*
    */__pycache__/*
    */site-packages/*

[coverage:report]
precision = 2
show_missing = True
skip_covered = False
exclude_lines =
    pragma: no cover
    def __repr__
    raise AssertionError
    raise NotImplementedError
    if __name__ == .__main__.:
    if TYPE_CHECKING:
    @abstractmethod
