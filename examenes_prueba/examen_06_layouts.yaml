nombre_examen: Examen con Diferentes Layouts
institucion: UNRN - Sede Andina
materia: Programación 1
fecha: '2025-11-10'
duracion_minutos: 90
instrucciones_generales: 'Este examen demuestra los diferentes layouts disponibles.


  Cada sección usa un layout diferente optimizado para su contenido:

  - Parte 1: Layout por defecto (ideal para análisis de código)

  - Parte 2: Layout compacto 2 columnas (preguntas cortas)

  - Parte 3: Layout compacto 3 columnas (máxima densidad)

  '
idioma: es
configuracion_examen:
  mezclar_preguntas_dentro_seccion: true
  mezclar_opciones_dentro_pregunta: true
  generar_clave_profesor: true
variables_personalizadas:
  profesor: Prof. García
  aula: Aula 301
  tema: Estructuras de Datos
  info: Examen con layouts optimizados
secciones_examen:
- nombre: 'Parte 1: Análisis de Código (Layout Default)'
  instrucciones: 'Este layout es ideal para preguntas con código extenso.

    El enunciado ocupa 2/3 del ancho y las opciones 1/3 a la derecha.

    '
  layout: default
  pools:
  - cantidad: 5
    tipos:
    - seleccion_multiple
    accion_si_insuficiente: advertir
- nombre: 'Parte 2: Preguntas Cortas (Layout 2 Columnas)'
  instrucciones: 'Layout compacto con respuestas en 2 columnas debajo de cada pregunta.

    Ideal para preguntas teóricas con opciones cortas.

    '
  layout: compact-2col
  pools:
  - cantidad: 10
    tipos:
    - seleccion_multiple
    accion_si_insuficiente: usar_todas
- nombre: 'Parte 3: Máxima Densidad (Layout 3 Columnas)'
  instrucciones: 'Layout ultra-compacto con respuestas en 3 columnas.

    Minimiza el uso de papel manteniendo legibilidad.

    '
  layout: compact-3col
  pools:
  - cantidad: 15
    tipos:
    - seleccion_multiple
    accion_si_insuficiente: usar_todas
