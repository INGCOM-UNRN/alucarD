nombre_examen: "Examen Final - Programación 1"
institucion: "Universidad Nacional de Río Negro - Sede Andina"
materia: "Introducción a la Programación"
fecha: "2025-12-01"
duracion_minutos: 150
instrucciones_generales: |
  EXAMEN FINAL - INSTRUCCIONES GENERALES
  
  Este examen es integral y cubre todos los temas del cuatrimestre.
  
  Estructura del examen:
  • Parte 1: Sintaxis y Semántica (30 min)
  • Parte 2: Estructuras de Control (40 min)
  • Parte 3: Funciones y Módulos (40 min)
  • Parte 4: Algoritmos Avanzados (40 min)
  
  Normas:
  - No se permite material de consulta
  - Calculadora permitida solo para Parte 4
  - Entregar todas las hojas al finalizar
  
  ¡Éxitos!
idioma: "es"

configuracion_examen:
  mezclar_preguntas_dentro_seccion: true
  mezclar_opciones_dentro_pregunta: true
  generar_clave_profesor: true

variables_personalizadas:
  # Información del docente
  profesor: "Dr. Pablo Sánchez"
  email: "psanchez@unrn.edu.ar"
  telefono: "+54 294 123-4567"
  departamento: "Escuela de Producción, Tecnología y Medio Ambiente"
  oficina: "Oficina 205, Edificio Central"
  
  # Información del examen
  tipo_examen: "Examen Final Integrador"
  modalidad: "Presencial"
  puntaje_total: "100 puntos"
  puntaje_aprobacion: "60 puntos"
  
  # Información administrativa
  codigo_materia: "INFO-101"
  plan_estudios: "Plan 2023"
  creditos: "6 créditos"
  carrera: "Licenciatura en Sistemas"
  
  # Variables compuestas
  titulo_completo: "{tipo_examen}: {nombre_examen}"
  subtitulo: "{materia} ({codigo_materia})"
  info_carrera: "{carrera} | {plan_estudios} | {creditos}"
  
  info_docente: "Profesor: {profesor}"
  contacto_completo: "Email: {email} | Tel: {telefono}"
  ubicacion_oficina: "Consultas en {oficina}"
  
  criterio_aprobacion: "Puntaje mínimo: {puntaje_aprobacion} de {puntaje_total}"
