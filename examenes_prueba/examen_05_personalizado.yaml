secciones_examen:
  - nombre: "Parte 1: Sintaxis y Semántica Básica (20 puntos)"
    instrucciones: |
      Responde las siguientes preguntas sobre sintaxis básica de programación.
      Cada pregunta vale 2 puntos.
    pools:
      - cantidad: 10
        tipos: ["seleccion_multiple"]
        accion_si_insuficiente: advertir
  
  - nombre: "Parte 2: Estructuras de Control (25 puntos)"
    instrucciones: |
      Analiza los fragmentos de código con estructuras de control.
      Preguntas de mayor complejidad.
    pools:
      - cantidad: 5
        tipos: ["seleccion_multiple"]
        accion_si_insuficiente: advertir
  
  - nombre: "Parte 3: Funciones y Módulos (25 puntos)"
    instrucciones: |
      Evalúa tu comprensión de funciones, parámetros y módulos.
    pools:
      - cantidad: 8
        tipos: ["seleccion_multiple"]
        accion_si_insuficiente: advertir
  
  - nombre: "Parte 4: Algoritmos y Complejidad (30 puntos)"
    instrucciones: |
      Preguntas avanzadas sobre algoritmos, estructuras de datos y complejidad.
      Esta sección tiene el mayor peso en la calificación final.
    pools:
      - cantidad: 20
        tipos: ["seleccion_multiple"]
        accion_si_insuficiente: usar_todas
