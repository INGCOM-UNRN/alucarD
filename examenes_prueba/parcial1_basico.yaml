nombre_examen: "Parcial I - Fundamentos de Programación"
institucion: "Universidad Nacional de Río Negro - Sede Andina"
materia: "Programación 1"
fecha: "2025-11-20"
duracion_minutos: 90
instrucciones_generales: |
  - Lee cuidadosamente cada pregunta antes de responder.
  - Marca la respuesta correcta con una X en el casillero correspondiente.
  - Solo se admite una respuesta por pregunta.
  - No se permite el uso de material de consulta.
idioma: "es"

configuracion_examen:
  mezclar_preguntas_dentro_seccion: true
  mezclar_opciones_dentro_pregunta: true
  generar_clave_profesor: true

variables_personalizadas:
  profesor: "Prof. Juan Pérez"
  email_contacto: "juan.perez@unrn.edu.ar"
  aula: "Aula 205"
  comision: "Comisión A - Turno Mañana"
  periodo: "Segundo Cuatrimestre {anio_actual}"
  titulo_completo: "{nombre_examen} | {materia}"

secciones_examen:
  - nombre: "Parte 1: Conceptos Básicos"
    instrucciones: "Selecciona la respuesta correcta"
    layout: "compact-2col"
    pools:
      - tipos: ["seleccion_multiple"]
        cantidad: 15
        accion_si_insuficiente: usar_todas
  
  - nombre: "Parte 2: Verdadero o Falso"
    instrucciones: "Marca V (Verdadero) o F (Falso)"
    layout: "compact-3col"
    pools:
      - tipos: ["verdadero_falso"]
        cantidad: 10
        accion_si_insuficiente: usar_todas
