  departamento: "Informática"
  periodo: "Primer Cuatrimestre {anio_actual}"
  pie_pagina: "{materia} - {profesor}"

secciones_examen:
  - nombre: "Parte 1: Análisis de Código"
    instrucciones: "Analiza el código y selecciona la respuesta correcta"
    pools:
      - cantidad: 10
        tipos: ["seleccion_multiple"]
        accion_si_insuficiente: advertir
