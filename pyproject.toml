[project]
name = "generador-examenes"
version = "5.0.0"
description = "Generador de exámenes basado en plantillas, YAML y bancos Moodle/GIFT."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "alucarD Team", email = "team@alucard.dev"}
]
keywords = ["exam", "generator", "moodle", "gift", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Topic :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "jinja2>=3.1,<4.0",
    "weasyprint>=60.0,<61.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8.0",
    "pytest-cov>=4.0,<5.0",
    "pytest-xdist>=3.0,<4.0",
    "black>=23.0,<24.0",
    "flake8>=6.0,<7.0",
    "isort>=5.12,<6.0",
    "mypy>=1.0,<2.0",
]

[project.scripts]
generador-examenes = "generador_examenes.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["generador_examenes"]

# Compatibilidad con Poetry (opcional)
[tool.poetry]
name = "generador-examenes"
version = "5.0.0"
description = "Generador de exámenes basado en plantillas, YAML y bancos Moodle/GIFT."
authors = ["alucarD Team <team@alucard.dev>"]
readme = "README.md"
packages = [{include = "generador_examenes"}]

[tool.poetry.dependencies]
python = "^3.10"
pydantic = "^2.0"
pyyaml = "^6.0"
jinja2 = "^3.1"
weasyprint = "^60.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0"
pytest-cov = "^4.0"
