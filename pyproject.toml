[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generador-examenes"
version = "5.11.0"
description = "Generador de exámenes basado en plantillas, YAML y bancos Moodle/GIFT."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
keywords = ["education", "c-programming", "pedagogical-tools", "unrn", "exam", "generator", "moodle", "gift"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "jinja2>=3.1,<4.0",
    "markdown>=3.5,<4.0",
    "pygments>=2.17,<3.0",
    "rich>=13.0,<14.0",
    "typer>=0.12,<1.0",
    # Sin cota superior: pypdf<6 fijaba versiones con avisos de seguridad (N-ALUCARD-01). La API
    # usada (PdfReader/PdfWriter) es estable entre esas versiones.
    "pypdf>=6.16",
    "typst>=0.11,<0.14",
    # Núcleo común del ecosistema (N-ECO-14): contrato de línea de comandos y textos en español.
    "yutani @ git+https://github.com/INGCOM-UNRN/yutani@6e42d7ab8b89a1084381f8aea0999a498a844f6c",
    "segno>=1.6,<2",
    "jsonschema>=4.20,<5",
    "pillow>=12.0",
    # Generador de diagramas SVG en Rust (instalado como binario en .venv/bin/dibu vía maturin).
    "dibu @ git+https://github.com/INGCOM-UNRN/dibu@d0a9944d9e0b656207f82aa6c6d691f68211f044",
]

[project.optional-dependencies]
# Herramientas del ecosistema que se usan como biblioteca (N-ECO-01). Referencias git fijadas
# a commits publicados (nunca por nombre: esos nombres están tomados en PyPI por terceros).
# Sin `ecosistema`, la síntesis compila con gcc directo; sin `languagetool`, spellcheck
# explica cómo instalarlo.
ecosistema = [
    "daedalus @ git+https://github.com/INGCOM-UNRN-P1/daedalus@0d3da518270cea8d6a0dff85d8cec61de2e89fff",
]
languagetool = [
    "myst-tools @ git+https://github.com/INGCOM-UNRN/mystmd-tools@1e7c3fdc4436c24ac369ad0d8b90a969a5ea8f5b",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN/alucarD"
Repository = "https://github.com/INGCOM-UNRN/alucarD.git"
Issues = "https://github.com/INGCOM-UNRN/alucarD/issues"

[project.scripts]
generador-examenes = "generador_examenes.__main__:main"
alucard = "generador_examenes.__main__:main"
gift-linter = "generador_examenes.gift_linter:main"

[tool.hatch.build.targets.wheel]
packages = ["generador_examenes"]
extra-metadata = {}

[tool.hatch.metadata]
# Las dependencias del ecosistema son referencias directas a git (nunca por nombre en PyPI).
allow-direct-references = true

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "black>=26.3.1",
    "flake8>=6.0,<7.0",
    "isort>=5.12,<6.0",
    "mypy>=1.0,<2.0",
    "types-PyYAML>=6.0",
    "types-Markdown>=3.5",
    "zxing-cpp>=2.2",
]

[tool.uv]
# Puente temporal mientras daedalus y myst-tools aún referencian INGCOM-UNRN-P1/yutani.
override-dependencies = [
    "yutani @ git+https://github.com/INGCOM-UNRN/yutani@6e42d7ab8b89a1084381f8aea0999a498a844f6c",
]

[tool.mypy]
# Tipos del paquete (N-ECO-08): `uv run mypy`, con los stubs del grupo dev, igual que el CI.
python_version = "3.11"
files = ["generador_examenes"]
ignore_missing_imports = true
