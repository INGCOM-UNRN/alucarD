[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generador-examenes"
version = "5.0.0"
description = "Generador de exámenes basado en plantillas, YAML y bancos Moodle/GIFT."
readme = "README.md"
requires-python = ">=3.11"
license = {text = "GPL-3.0-or-later"}
authors = [
    {name = "Martín René Vilugrón", email = "martinvilu@gmail.com"}
]
maintainers = [
    {name = "Programación I [B6003] - UNRN Andina"}
]
keywords = ["education", "c-programming", "pedagogical-tools", "unrn", "exam", "generator", "moodle", "gift"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Education",
    "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Education",
    "Topic :: Software Development :: Quality Assurance",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "jinja2>=3.1,<4.0",
    # Sin cota superior: weasyprint<61 y pypdf<6 fijaban versiones con avisos
    # de seguridad (N-ALUCARD-01). La API usada (HTML().write_pdf,
    # PdfReader/PdfWriter) es estable entre esas versiones.
    "weasyprint>=68.0",
    "markdown>=3.5,<4.0",
    "pygments>=2.17,<3.0",
    "rich>=13.0,<14.0",
    "typer>=0.12,<1.0",
    "pypdf>=6.16",
    "typst>=0.11,<0.14",
]

[project.urls]
Homepage = "https://github.com/INGCOM-UNRN-P1/alucarD"
Repository = "https://github.com/INGCOM-UNRN-P1/alucarD.git"
Issues = "https://github.com/INGCOM-UNRN-P1/alucarD/issues"

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=4.0",
    "pytest-xdist>=3.0",
    "black>=26.3.1",
    "flake8>=6.0,<7.0",
    "isort>=5.12,<6.0",
    "mypy>=1.0,<2.0",
]

[project.scripts]
generador-examenes = "generador_examenes.__main__:main"
alucard = "generador_examenes.__main__:main"
gift-linter = "generador_examenes.gift_linter:main"

[tool.hatch.build.targets.wheel]
packages = ["generador_examenes"]
extra-metadata = {}

