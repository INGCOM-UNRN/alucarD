[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "generador-examenes"
version = "5.0.0"
description = "Generador de exámenes basado en plantillas, YAML y bancos Moodle/GIFT."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "alucarD Team", email = "team@alucard.dev"}
]
keywords = ["exam", "generator", "moodle", "gift", "education"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Education",
    "Topic :: Education",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "jinja2>=3.1,<4.0",
    "weasyprint>=60.0,<61.0",
    "markdown>=3.5,<4.0",
    "pygments>=2.17,<3.0",
    "rich>=13.0,<14.0",
    "pypdf>=3.0,<6.0",
    "typst>=0.11,<0.14",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0,<8.0",
    "pytest-cov>=4.0,<5.0",
    "pytest-xdist>=3.0,<4.0",
    "black>=23.0,<24.0",
    "flake8>=6.0,<7.0",
    "isort>=5.12,<6.0",
    "mypy>=1.0,<2.0",
]

[project.scripts]
generador-examenes = "generador_examenes.__main__:main"
alucard = "generador_examenes.__main__:main"
gift-linter = "generador_examenes.gift_linter:main"

[tool.hatch.build.targets.wheel]
packages = ["generador_examenes"]
extra-metadata = {}

